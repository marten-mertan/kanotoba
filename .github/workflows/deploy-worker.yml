name: Deploy Kanotoba API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "database/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanotoba-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: |
          find backend/src scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -exec node --check {} \;

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy Worker and apply D1 migrations
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations before deploying code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KANOTOBA_WORKER_NAME: ${{ vars.KANOTOBA_WORKER_NAME }}
          KANOTOBA_D1_DATABASE_NAME: ${{ vars.KANOTOBA_D1_DATABASE_NAME }}
          KANOTOBA_D1_DATABASE_ID: ${{ vars.KANOTOBA_D1_DATABASE_ID }}
        run: npm run db:migrate:remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KANOTOBA_WORKER_NAME: ${{ vars.KANOTOBA_WORKER_NAME }}
          KANOTOBA_D1_DATABASE_NAME: ${{ vars.KANOTOBA_D1_DATABASE_NAME }}
          KANOTOBA_D1_DATABASE_ID: ${{ vars.KANOTOBA_D1_DATABASE_ID }}
        run: npm run deploy:api

      - name: Configure allowed frontend origins (optional)
        if: ${{ vars.KANOTOBA_ALLOWED_ORIGINS != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          KANOTOBA_WORKER_NAME: ${{ vars.KANOTOBA_WORKER_NAME }}
          KANOTOBA_D1_DATABASE_NAME: ${{ vars.KANOTOBA_D1_DATABASE_NAME }}
          KANOTOBA_D1_DATABASE_ID: ${{ vars.KANOTOBA_D1_DATABASE_ID }}
          KANOTOBA_ALLOWED_ORIGINS: ${{ vars.KANOTOBA_ALLOWED_ORIGINS }}
        run: |
          printf '%s' "$KANOTOBA_ALLOWED_ORIGINS" | npx wrangler secret put ALLOWED_ORIGINS --config backend/.wrangler.generated.json
